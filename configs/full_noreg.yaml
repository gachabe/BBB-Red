mode: full
seed: 42
results_dir: results/full_noreg
dataset: "Walchli et al., Nature 632, 603-613 (2024) - endotelio de glioma (GBM/LGG)"

data:
  path: 'C:\Users\Gabi\Downloads\GSE256493_Combined_Glioma_Endothelial__Normalized_FullGenes_Scanpy.h5ad'
  cache: true                      # copia rápida en data/processed (la primera carga es más lenta)
  cache_dir: data/processed
  expected_shape: [67372, 26666]   # (células, genes) del objeto de Walchli; si no coincide, es otro fichero
  patients_per_class: null         # null = todos los pacientes
  max_cells_per_patient: null      # null = todas las células

tasks: [glioma_type]

rom:
  hvg: 2000                        # genes más variables (elegidos solo con entrenamiento)
  components: [2, 5, 10, 20, 50]
  include_all_genes: true          # referencia con los 26.666 genes
  scale_clip: 10.0                 # recorta los valores escalados a +-10
  regress_out: null                # SIN regresión de profundidad (análisis de sensibilidad)

ml:
  max_train_cells_per_patient: 1000   # tope por paciente en entrenamiento (se evalúa con todas las células)
  rf_trees: 200
  control: true                    # etiquetas permutadas entre pacientes (debe dar el azar)
  by_cluster: true                 # acierto dentro de cada ECclusters

models:
  - logistic_regression
  - random_forest

permutation:                       # experiments.06_permutation
  n: all                        # "all" = todas las asignaciones posibles de pacientes (exacto)
  representations: [PCA-2, PCA-5, PCA-10, PCA-20, PCA-50]
  model: logistic_regression
  chunk: 10
  n_jobs: -1

tuning:                            # experiments.09_tune (validación anidada; rejilla por pareja representación-modelo)
  lr_C: [0.001, 0.01, 0.1, 1.0, 10.0]
  rf_grid:
    - {max_depth: null, min_samples_leaf: 1}
    - {max_depth: null, min_samples_leaf: 20}
